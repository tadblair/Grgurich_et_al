# Subjects
#
# The 47 rats in Grgurich R, Wang S, Wang Y, Pimenta J, Delafraz K, Blair HT,
# "Path Integration Promotes Flexible Navigational Decision Making" (Hippocampus),
# by subject_id, grouped the way each figure uses them. The figure notebooks read
# this file; the pipeline does not.
#
# `figure2` lists all 47: the 41 main-cohort rats (PI+VC, PI, VC) that Figures 2-5
# analyse, plus the 6 F1 rats (PI+VC_f1, cue fixed at the 1st choice point) that
# Figure 2G compares with the PI+VC group. `figure3`, `figure4` and `figure5` list
# their own subsets of the 41. `supp_fig1` lists all 47 for Supplementary Figure 1
# (response convergence during acquisition), which is not in the submitted manuscript
# and is kept in this repository because it justifies the acquisition criterion below.
#
# ACQUISITION CRITERION:
#   A rat is included if, on its FINAL acquisition session (32 trials),
#   it made >= 24/32 correct trials. 24/32 is the single-session
#   threshold at which the chance probability of passing is <= 0.01
#   under a binomial(n=32, p=0.5):
#       P(X >= 24 | 32, 0.5) = 0.0035   (P(X >= 23) = 0.0100, just over).
#   A "correct trial" = the rat entered the rewarded corner first,
#   before visiting any unrewarded corner (errors == 0). The two start
#   arms / routes are the frame-invariant L vs R routes (first letter of
#   `correct_route`), so the VC rotating frame is handled correctly.
#
#   Every rat listed below passes this criterion with margin (lowest
#   final acquisition session = 26/32).
#
# Counts:
#   PI+VC  : 17 (8M, 9F)
#   PI     : 12 (6M, 6F)
#   VC     : 12 (7M, 5F)
#   Total  : 41 for the Figs 2–5 main analyses
#   PI+VC_f1 : 6 (Figure 2G only; "F1" in the manuscript)
#   All      : 47 (supp_fig1)
#
# CM names verified against MazeControl DB (subjects.parquet).
# NOTE: subject_ids are NOT sequential with CM numbers — there are
# gaps from pilot/dropped rats (CM012, CM013, CM019–CM022, etc.).

