# Subject Exceptions
#
# Per-subject session-level rules that supplement the general cleaning
# filters (X-session and NULL-duration drops). Most anomalous sessions
# in MazeControl.db were already marked by the experimenter at the time
# they occurred (session_number = 'X' or session_duration = NULL), and
# those are handled automatically by Stage 1's general cleaning logic.
#
# This file captures two things:
#   1. Sessions that survive the general filter but need special handling
#      (action: drop, flag, or note).
#   2. Provenance notes that document *why* the raw DB marks exist, so
#      the reasoning is preserved as structured data rather than prose.
#
# Schema per entry:
#   subject_id:    int   — matches MazeControl.db
#   name:          str   — human-readable, for orientation only
#   exceptions:    list  — each entry has:
#     - session_id:    int or null  — if known; null for notes-only entries
#       session_type:  str          — for cross-checking
#       action:        str          — 'drop' | 'flag' | 'restore' | 'note'
#                                     drop    = remove from cleaned DB
#                                     flag    = keep but add to cleaning_review.txt
#                                     restore = session is marked X/NULL in raw DB
#                                               but should be KEPT in cleaned DB
#                                               (un-X before the general drop runs)
#                                     note    = documentation only, no action
#       reason:        str          — why
#
# IMPORTANT: The raw DB (data/raw/MazeControl.db) is never edited directly.
# All drops and restores happen through this file and Stage 1's cleaning
# logic, so the raw record stays as the rig wrote it.
#
# Merge cases (subjects 50, 51, 53, 80) are handled by Stage 1's
# duplicate-detection logic, not by this file. They are documented in
# the development repository's notes.

