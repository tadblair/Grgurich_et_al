# Subject exceptions
#
# Per-subject notes and rules for Stage 1 (data/pipeline/stage1_clean_db.py), keyed by
# subject_id. The file has two jobs:
#
#   1. It records why each session the experimenter voided at the time was voided. Those
#      sessions are marked in the raw database (session_number = 'X', or a null
#      session_duration after an aborted start) and Stage 1 drops them by that mark; the
#      entry here is the reason, kept as data rather than prose.
#   2. It can override Stage 1's general rules for a named session: `drop` removes a
#      session the marks would keep, `restore` keeps one the marks would drop, `flag`
#      keeps it and lists it in cleaning_review.txt. This release needs none of these;
#      every entry is a `note`.
#
# Schema per entry:
#   subject_id:    int   — matches MazeControl.db
#   name:          str   — CM name, for orientation only
#   exceptions:    list  — each entry has:
#     - session_id:    int or null  — null for notes that cover several entries
#       session_type:  str          — for cross-checking
#       action:        str          — 'note' | 'drop' | 'flag' | 'restore' (see above)
#       reason:        str          — why
#
# The raw database (data/raw/MazeControl.db) is never edited. Every drop and restore goes
# through this file and Stage 1, so the raw record stays as the rig wrote it.
#
# Sessions recorded in two parts (an aborted start re-run the same day) are merged by
# Stage 1 on matching (subject_id, session_number); the parts are listed in
# processed/session_segments.parquet. The three cases are noted under subjects 50, 51
# and 53 below, keyed by the raw session_id of the second part, which the merge removes.

# ── CM subjects ──────────────────────────────────────────────────────

